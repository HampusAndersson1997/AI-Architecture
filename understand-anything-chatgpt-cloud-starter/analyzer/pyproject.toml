[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ua-deterministic-analyzer"
version = "0.1.0"
description = "Dependency-free deterministic knowledge graph analyzer"
requires-python = ">=3.11"

[project.scripts]
ua-analyzer = "ua_analyzer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
