name: Publish Understand Anything ChatGPT cloud starter

on:
  push:
    branches:
      - feat/understand-anything-chatgpt-cloud-starter
    paths:
      - .publish/READY

permissions:
  contents: write

concurrency:
  group: publish-understand-anything-chatgpt-cloud-starter
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: feat/understand-anything-chatgpt-cloud-starter
          fetch-depth: 0

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/part-*.b64 | base64 --decode > /tmp/understand-anything-chatgpt-cloud-starter.zip
          echo "22e10f67df1b03d9894dbb33469e609cd51e4c906a2a81b467f5e1fcfb9eebda  /tmp/understand-anything-chatgpt-cloud-starter.zip" | sha256sum --check --strict

      - name: Expand starter safely
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path('/tmp/understand-anything-chatgpt-cloud-starter.zip')
          destination = Path('understand-anything-chatgpt-cloud-starter').resolve()
          destination.mkdir(parents=True, exist_ok=True)

          with ZipFile(archive) as bundle:
              for member in bundle.infolist():
                  target = (destination / member.filename).resolve()
                  if destination not in target.parents and target != destination:
                      raise SystemExit(f'Unsafe archive path: {member.filename}')
              bundle.extractall(destination)

      - name: Remove one-shot publishing files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .publish
          rm -f .github/workflows/publish-starter.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit expanded starter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Understand Anything ChatGPT cloud starter"
          git push origin HEAD:feat/understand-anything-chatgpt-cloud-starter
